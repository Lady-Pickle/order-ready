<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Staff · Order ready</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="staff.css">
</head>
<body>
  <!-- The staff page, on a phone at the counter: add a number when an order comes in,
       tap Ready when it's done, and Collected when the customer picks it up.
       data-text="..." marks the words that change with the language (see TEXT in staff.js). -->
  <header class="top">
    <div>
      <p class="eyebrow">Staff · Kakitangan</p>
      <h1 id="cafe"></h1>
    </div>
    <button id="language" class="language" type="button"></button>
  </header>

  <!-- Asked once on each phone (if the café set a PIN), so customers can't change the screen -->
  <form id="pin-form" class="add pin" hidden>
    <label for="pin" data-text="pinLabel">Staff PIN</label>
    <div class="add-row">
      <input id="pin" type="password" inputmode="numeric" autocomplete="off">
      <button type="submit" data-text="start">Start</button>
    </div>
    <p class="hint" data-text="pinHint">Only once on each phone: it's remembered after that.</p>
    <p id="pin-problem" class="problem" role="alert"></p>
  </form>

  <p id="offline" class="offline" role="status" data-text="offline" hidden>Can't reach the server. Check the Wi-Fi; it keeps trying.</p>

  <main id="main">
    <form id="add" class="add">
      <label for="number" data-text="newNumber">New order number</label>
      <div class="add-row">
        <input id="number" name="number" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="6">
        <button type="submit" data-text="add">Add</button>
      </div>
      <p id="problem" class="problem" role="alert"></p>
    </form>

    <section class="list preparing">
      <h2><span data-text="preparing">Preparing</span> <span id="preparing-count" class="count"></span></h2>
      <ul id="preparing" class="orders"></ul>
    </section>

    <section class="list ready">
      <h2><span data-text="ready">Ready to collect</span> <span id="ready-count" class="count"></span></h2>
      <ul id="ready" class="orders"></ul>
    </section>

    <p class="tv-link"><a href="/tv" target="_blank" data-text="openTv">Open the TV screen ↗</a></p>
  </main>

  <!-- After a number is collected or removed: a few seconds to take it back -->
  <div id="undo" class="undo" role="status" hidden>
    <span id="undo-text"></span>
    <button id="undo-button" type="button" data-text="undo">Undo</button>
  </div>

  <footer class="foot">Order screen by <b><i>{</i>SA<i>}</i></b></footer>

  <!-- settings.js first (the café's name), then talking to the server, then this page -->
  <script src="settings.js"></script>
  <script src="orders.js"></script>
  <script src="staff.js"></script>
</body>
</html>
